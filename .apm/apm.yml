---
name: home
version: 0.0.0
targets:
  - agent-skills
  - claude
dependencies:
  apm:
    - anthropics/skills/skills/skill-creator
    - mattpocock/skills/skills/productivity/grill-me
    - mattpocock/skills/skills/productivity/grilling
    - mattpocock/skills/skills/productivity/teach
    - mattpocock/skills/skills/productivity/writing-for-agents
    - microsoft/playwright-cli/skills/playwright-cli
    - modular/skills/mojo-python-interop
    - modular/skills/mojo-syntax
    # Reverse Engineer Anything.  Keep this tag, the `rea` MCP server below,
    # and `npm:rea-agents` in ~/.config/mise/config.toml on one version.
    - morluto/rea/.agents/skills/reverse-engineer-anything#rea-agents-6.9.0
    - shadcn/improve
  mcp:
    # Write each secret as ${VAR:-}.  apm resolves a plain ${VAR} to its
    # value at install time and writes that value into the harness config;
    # the ${VAR:-} form passes through unchanged and Claude Code expands it
    # at launch.  Keep codex out of `targets`: apm cannot write this form
    # into a Codex config.  Pi reads these entries through its claude-code
    # import; after an install, run `/mcp-adapter` in Pi to refresh them.

    # DeepWiki -- Free hosted Q&A and code search over any public GitHub repo
    # https://deepwiki.com
    - name: deepwiki
      registry: false
      transport: streamable-http
      url: https://mcp.deepwiki.com/mcp

    # Context7 -- Hosted service providing up-to-date library and API docs
    # https://context7.com/dashboard
    - name: context7
      registry: false
      transport: streamable-http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}

    # paper-search -- Local MCP search service for scholarly papers
    # https://github.com/openags/paper-search-mcp
    - name: paper-search
      registry: false
      transport: stdio
      command: paper-search-mcp
      env:
        PAPER_SEARCH_MCP_CORE_API_KEY: '${PAPER_SEARCH_MCP_CORE_API_KEY:-}'
        PAPER_SEARCH_MCP_DOAJ_API_KEY: '${PAPER_SEARCH_MCP_DOAJ_API_KEY:-}'
        PAPER_SEARCH_MCP_IEEE_API_KEY: '${PAPER_SEARCH_MCP_IEEE_API_KEY:-}'
        PAPER_SEARCH_MCP_OPENALEX_API_KEY: '${PAPER_SEARCH_MCP_OPENALEX_API_KEY:-}'
        PAPER_SEARCH_MCP_UNPAYWALL_EMAIL: '${PAPER_SEARCH_MCP_UNPAYWALL_EMAIL:-}'
        PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY: '${PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY:-}'
        PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN: '${PAPER_SEARCH_MCP_ZENODO_ACCESS_TOKEN:-}'

    # Hugging Face -- Repository tools
    # https://huggingface.co/mcp
    - name: huggingface
      registry: false
      transport: http
      url: https://huggingface.co/mcp?login
      env:
        HF_TOKEN: '${HF_TOKEN:-}'

    # Reverse Engineer Anything -- stdio MCP server from the mise-installed
    # `rea` binary (npm:rea-agents).  Output schemas are 92% of the default
    # catalog (4.6 MB); `compact` plus this family list gives 174 tools at
    # about 460 KB.  Add a family here when a job needs it (frida, pcap, ...).
    # https://github.com/morluto/rea
    - name: rea
      registry: false
      transport: stdio
      command: rea
      args:
        - mcp
      env:
        REA_MCP_TOOL_FAMILIES: session,enhanced,native,electron,application,android,apktool,adb,artifact
        REA_MCP_INPUT_SCHEMA_PROFILE: compact
        REA_MCP_OUTPUT_SCHEMA_PROFILE: compact
includes: auto
scripts: {}
