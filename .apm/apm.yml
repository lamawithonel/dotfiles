---
name: home
version: 0.0.0
targets:
  - agent-skills
  - claude
dependencies:
  apm:
    - anthropics/skills/skills/skill-creator
    - mattpocock/skills/skills/productivity/grill-me
    - mattpocock/skills/skills/productivity/grilling
    - mattpocock/skills/skills/productivity/teach
    - mattpocock/skills/skills/productivity/writing-for-agents
    - microsoft/playwright-cli/skills/playwright-cli
    - modular/skills/mojo-python-interop
    - modular/skills/mojo-syntax
    # Reverse Engineer Anything.  Keep this tag and `npm:rea-agents` in
    # ~/.config/mise/config.toml on one version.  The `rea` MCP server is
    # off by default (it costs memory in every session): start a session
    # with `-- --mcp-config ~/.agents/mcp/rea.json` to load it.
    - morluto/rea/.agents/skills/reverse-engineer-anything#rea-agents-6.9.0
    - OpenRouterTeam/skills/skills/openrouter-analytics
    - OpenRouterTeam/skills/skills/openrouter-analytics-query
    - OpenRouterTeam/skills/skills/openrouter-analytics-schema
    - OpenRouterTeam/skills/skills/openrouter-benchmarks
    - OpenRouterTeam/skills/skills/openrouter-models
    - OpenRouterTeam/skills/skills/openrouter-stt
    - OpenRouterTeam/skills/skills/openrouter-tts
    - OpenRouterTeam/skills/skills/openrouter-images
    - OpenRouterTeam/skills/skills/openrouter-video
    - shadcn/improve
  mcp:
    # Write each secret as ${VAR:-}.  apm resolves a plain ${VAR} to its
    # value at install time and writes that value into the harness config;
    # the ${VAR:-} form passes through unchanged and Claude Code expands it
    # at launch.  Keep codex out of `targets`: apm cannot write this form
    # into a Codex config.  Pi reads these entries through its claude-code
    # import; after an install, run `/mcp-adapter` in Pi to refresh them.

    # DeepWiki -- Free hosted Q&A and code search over any public GitHub repo
    # https://deepwiki.com
    - name: deepwiki
      registry: false
      transport: streamable-http
      url: https://mcp.deepwiki.com/mcp

    # Context7 -- Hosted service providing up-to-date library and API docs
    # https://context7.com/dashboard
    - name: context7
      registry: false
      transport: streamable-http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}

    # paper-search -- Shared local MCP search service for scholarly papers
    # https://github.com/openags/paper-search-mcp
    # Served by ~/.config/systemd/user/paper-search-mcp.service (port 8791,
    # 127.0.0.1 only).  The API keys live in the service, not in sessions.
    - name: paper-search
      registry: false
      transport: http
      url: http://127.0.0.1:8791/mcp

    # Hugging Face -- Repository tools
    # https://huggingface.co/mcp
    - name: huggingface
      registry: false
      transport: http
      url: https://huggingface.co/mcp?login
      env:
        HF_TOKEN: '${HF_TOKEN:-}'
includes: auto
scripts: {}
